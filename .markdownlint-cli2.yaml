# Правила линтера Markdown для документации ResumeGPT
config:
  default: true
  MD013: false        # длина строки: абзацы пишутся одной строкой
  MD024:
    siblings_only: true  # одинаковые заголовки допустимы в разных разделах
  MD033: false        # HTML нужен для якорей и комментариев сгенерированных страниц
  MD036: false        # жирный текст в начале абзаца — не заголовок
  MD041: false        # сгенерированные страницы начинаются с HTML-комментария
  MD060: false        # стиль выравнивания столбцов таблиц не навязываем
globs:
  - "README.md"
  - "docs/**/*.md"
  - "team/**/*.md"
  - "report/**/*.md"
