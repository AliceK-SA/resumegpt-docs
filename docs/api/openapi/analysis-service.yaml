openapi: 3.0.3
info:
  title: ResumeGPT — analysis-service
  version: 1.0.0
  description: |
    Заявки на анализ резюме, их статусы и архив результатов. Оркестратор процесса анализа.

    **Идемпотентность.** `POST /analyses` требует заголовок `Idempotency-Key` (UUID; клиент
    генерирует его один раз на нажатие кнопки «Анализировать»). Повтор с тем же ключом возвращает
    ту же заявку — второй анализ не создаётся и второй кредит не резервируется.
    Ключи хранятся 24 часа.

    **Пользователь.** API Gateway проверяет JWT и передаёт `X-User-Id`.
    Заявка видна только своему владельцу.

    **Внутренний API** (`/internal/...`) доступен только из сети сервисов, наружу через Gateway не публикуется.
servers:
- url: http://analysis-service:8080
  description: Внутренний адрес (docker-compose)
- url: http://localhost:8000/api
  description: Через API Gateway (только публичные методы)
tags:
- name: Analyses
  description: Публичный API для веб-клиента
- name: Internal
  description: Для ai-worker
paths:
  /analyses:
    post:
      tags: [Analyses]
      operationId: createAnalysis
      summary: Запустить анализ резюме под вакансию
      description: |
        1. Сохраняет файл в MinIO и создаёт заявку `CREATED`.
        2. Для режима `ADVANCED` синхронно резервирует 1 кредит в billing-service
           (ключ резерва = `analysisId`, повтор безопасен).
        3. Переводит заявку в `QUEUED` и одной транзакцией пишет в outbox команду
           `analysis.requested` (приоритет 9 для ADVANCED, 1 для BASIC).

        Ответ `202 Accepted`: анализ выполняется асинхронно, клиент опрашивает `GET /analyses/{id}`.

        Ограничение Gateway: не более 10 новых анализов в минуту на пользователя; `429` и `Retry-After` при превышении.
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [resume, vacancyUrl, mode]
              properties:
                resume:
                  type: string
                  format: binary
                  description: PDF или DOCX, не больше 5 МБ
                vacancyUrl:
                  type: string
                  format: uri
                  example: https://hh.ru/vacancy/123456789
                mode:
                  $ref: '#/components/schemas/AnalysisMode'
      responses:
        '202':
          description: Заявка принята
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Analysis'
        '402':
          description: Недостаточно кредитов для продвинутого анализа
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '413':
          description: Файл больше 5 МБ
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: Неподдерживаемый формат файла или ссылка не на hh.ru
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: |
            billing-service недоступен — продвинутый анализ сейчас запустить нельзя.
            Базовый анализ (`mode = BASIC`) от billing-service не зависит и работает.
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Токен отсутствует, недействителен или истёк
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Доступ к ресурсу или операции запрещён
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: Шлюз ограничивает запуск до 10 анализов в минуту на пользователя
          headers:
            Retry-After:
              description: Секунды до повторного запроса
              schema:
                type: integer
                minimum: 0
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - UserBearer: []
    get:
      tags: [Analyses]
      operationId: listAnalyses
      summary: Архив анализов пользователя
      parameters:
      - $ref: '#/components/parameters/UserId'
      - name: page
        in: query
        schema:
          type: integer
          minimum: 0
          default: 0
      - name: size
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 50
          default: 20
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items, page, total]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Analysis'
                  page:
                    type: integer
                  total:
                    type: integer
        '401':
          description: Токен отсутствует, недействителен или истёк
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Доступ к ресурсу или операции запрещён
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - UserBearer: []
  /analyses/{analysisId}:
    get:
      tags: [Analyses]
      operationId: getAnalysis
      summary: Статус и результат анализа
      description: Клиент опрашивает раз в 2 секунды, пока статус не станет COMPLETED или FAILED.
      parameters:
      - $ref: '#/components/parameters/AnalysisId'
      - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Analysis'
        '404':
          description: Не найдено (или принадлежит другому пользователю)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Токен отсутствует, недействителен или истёк
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Доступ к ресурсу или операции запрещён
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - UserBearer: []
  /internal/analyses/{analysisId}/lease:
    post:
      tags: [Internal]
      operationId: leaseAnalysis
      summary: Воркер арендует задачу перед началом работы
      description: |
        Атомарно выдать одну аренду: условный UPDATE по id, status=QUEUED и attempt.
        В ответе выдаётся новый UUID leaseToken, он хранится вместе с lease_owner и lease_until.
        Первоначальная длительность аренды: 240 с. Воркер подтверждает сообщение после аренды,
        а затем продлевает её отдельным запросом до истечения. По завершении результата событие
        должно содержать attempt, workerId и leaseToken: совпадение всех полей и действующая
        аренда проверяются перед фиксацией COMPLETED/FAILED. Результат старой попытки отклоняется.
        Внешние обращения ограничены общим дедлайном, продление аренды не бесконечно.
        Это гарантирует одно окончательное изменение состояния, но не исключает повторный вызов Groq.
      parameters:
      - $ref: '#/components/parameters/AnalysisId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [workerId, attempt]
              properties:
                workerId:
                  type: string
                  example: ai-worker-7c9f
                attempt:
                  type: integer
                  minimum: 1
                  description: Номер попытки из сообщения analysis.requested
      responses:
        '200':
          description: Аренда выдана (leaseToken и leaseUntil)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeaseGrant'
        '409':
          description: Задача недоступна (уже в работе, завершена или попытка устарела)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Токен отсутствует, недействителен или истёк
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - ServiceBearer: []
  /internal/analyses/{analysisId}/lease/renew:
    post:
      tags:
      - Internal
      operationId: renewAnalysisLease
      summary: Продлить действующую аренду во время обработки
      description: Продление разрешено только владельцу текущей аренды с тем же attempt и leaseToken. Следующее 
        leaseUntil не может превышать общий дедлайн попытки. Неверный/истёкший токен даёт 409.
      security:
      - ServiceBearer: []
      parameters:
      - $ref: '#/components/parameters/AnalysisId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - workerId
              - attempt
              - leaseToken
              properties:
                workerId:
                  type: string
                attempt:
                  type: integer
                  minimum: 1
                leaseToken:
                  type: string
                  format: uuid
      responses:
        '200':
          description: Аренда продлена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeaseGrant'
        '401':
          description: Неавторизованный сервис
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: Аренда истекла, уже принадлежит другой попытке или превышен дедлайн
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
components:
  parameters:
    AnalysisId:
      name: analysisId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        format: uuid
    UserId:
      name: X-User-Id
      in: header
      required: true
      description: 'Заголовок доверенной идентичности. Браузер не задаёт его: API Gateway удаляет входящий X-User-Id
        и проставляет идентификатор из проверенного JWT. Внутренний сервис принимает его только от доверенного шлюза.'
      schema:
        type: string
        format: uuid
      x-internal-gateway-header: true
  schemas:
    AnalysisMode:
      type: string
      description: |
        - `BASIC` — бесплатно, общая очередь, базовая модель
        - `ADVANCED` — 1 кредит, приоритет в очереди, продвинутая модель, сопроводительное письмо
      enum: [BASIC, ADVANCED]
    AnalysisStatus:
      type: string
      description: |
        - `CREATED` — файл сохранён, для ADVANCED резервируется кредит
        - `QUEUED` — задача в очереди
        - `PROCESSING` — воркер арендовал задачу и работает
        - `COMPLETED` — результат готов
        - `FAILED` — анализ не удался; для ADVANCED кредит возвращается
      enum: [CREATED, QUEUED, PROCESSING, COMPLETED, FAILED]
    CreditStatus:
      type: string
      description: |
        Судьба кредита глазами analysis-service:
        - `NOT_REQUIRED` — базовый анализ
        - `RESERVED` — кредит заморожен
        - `CHARGED` — анализ удался, отправлена команда на списание
        - `RETURNED` — анализ не удался, отправлена команда на возврат
        Команды доставляются гарантированно (outbox), поэтому `CHARGED` и `RETURNED` — окончательные.
      enum: [NOT_REQUIRED, RESERVED, CHARGED, RETURNED]
    FailureReason:
      type: string
      description: |
        - `VACANCY_NOT_FOUND` — вакансия удалена или ссылка неверная
        - `RESUME_UNREADABLE` — не удалось извлечь текст (скан без текста, битый файл)
        - `AI_UNAVAILABLE` — Groq не ответил за все попытки
        - `ATTEMPTS_EXHAUSTED` — воркеры падали на этой задаче 3 раза подряд
        - `RESERVATION_TIMEOUT` — не удалось зарезервировать кредит за 10 минут
      enum: [VACANCY_NOT_FOUND, RESUME_UNREADABLE, AI_UNAVAILABLE, ATTEMPTS_EXHAUSTED, RESERVATION_TIMEOUT]
    Analysis:
      type: object
      required: [id, mode, status, creditStatus, vacancyUrl, createdAt]
      properties:
        id:
          type: string
          format: uuid
        mode:
          $ref: '#/components/schemas/AnalysisMode'
        status:
          $ref: '#/components/schemas/AnalysisStatus'
        creditStatus:
          $ref: '#/components/schemas/CreditStatus'
        vacancyUrl:
          type: string
          format: uri
        resumeFileName:
          type: string
          example: Ivanova_CV.pdf
        attempt:
          type: integer
          description: Номер текущей попытки (1–3)
        failureReason:
          $ref: '#/components/schemas/FailureReason'
        result:
          $ref: '#/components/schemas/AnalysisResult'
        createdAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
    AnalysisResult:
      type: object
      description: Строгая схема результата. ai-worker проверяет ответ LLM на соответствие ей.
      required: [atsScore, matchedSkills, missingSkills, issues, suggestions]
      properties:
        atsScore:
          type: integer
          minimum: 0
          maximum: 100
          description: Оценка совместимости с ATS
        matchedSkills:
          type: array
          items:
            type: string
          example: [Java, Spring Boot, PostgreSQL]
        missingSkills:
          type: array
          items:
            type: string
          example: [Kafka, Kubernetes]
        issues:
          type: array
          items:
            type: object
            required: [severity, text]
            properties:
              severity:
                type: string
                enum: [HIGH, MEDIUM, LOW]
              text:
                type: string
        suggestions:
          type: array
          description: Конкретные переформулировки
          items:
            type: object
            required: [original, improved]
            properties:
              original:
                type: string
              improved:
                type: string
        coverLetter:
          type: string
          description: Только для ADVANCED
        model:
          type: string
          description: Какая модель делала анализ
    LeaseGrant:
      type: object
      required: [analysisId, attempt, leaseUntil, mode, resumeObjectKey, vacancyUrl, leaseToken]
      properties:
        analysisId:
          type: string
          format: uuid
        attempt:
          type: integer
        leaseUntil:
          type: string
          format: date-time
          description: Если к этому моменту нет результата, watchdog вернёт задачу в очередь
        mode:
          $ref: '#/components/schemas/AnalysisMode'
        resumeObjectKey:
          type: string
          description: Путь к файлу в бакете MinIO resumes
          example: 9f1e…/2b7c…/Ivanova_CV.pdf
        vacancyUrl:
          type: string
          format: uri
        leaseToken:
          type: string
          format: uuid
          description: Токен текущей аренды (fencing), требуется в событиях результата
    Problem:
      type: object
      description: Ошибка в формате RFC 9457 (Problem Details)
      required: [type, title, status]
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
  securitySchemes:
    UserBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'Публичный вызов: JWT проверяет API Gateway, после чего удаляет клиентский X-User-Id и выставляет
        проверенный идентификатор'
    ServiceBearer:
      type: http
      scheme: bearer
      bearerFormat: service JWT
      description: Контрактный механизм межсервисной авторизации; настройка токенов и выдача ключей требуется в 
        части реализации. Сетевой изоляции недостаточно.
